name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: velocity_test
          POSTGRES_USER: velocity_test
          POSTGRES_PASSWORD: velocity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U velocity_test -d velocity_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+asyncpg://velocity_test:velocity_test@localhost:5432/velocity_test
      ADMIN_EMAIL: admin@velocitycrm.com
      ADMIN_PASSWORD: VelocityAdmin@2026
      JWT_SECRET: velocity-ci-only-signing-secret
      DATABASE_POOLING_ENABLED: "false"
      PROACTIVE_MONITORING_ENABLED: "true"
      CRM_ADAPTER: local
      ZOHO_CLIENT_ID: velocity-ci-client-id
      ZOHO_CLIENT_SECRET: velocity-ci-client-secret
      ZOHO_SCOPES: ZohoCRM.modules.deals.READ

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Run backend tests
        run: python -m pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build